<!DOCTYPE html>
<html style="background: black">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chupato Launcher</title>
    <link
      rel='icon'
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>"
    />
<style type="text/css">
:root {
  color-scheme: dark;
}

@font-face {
  font-family: system-ui;
  font-style: normal;
  font-weight: 300;
  src: local(".SFNS-Light"), local(".SFNSText-Light"), local(".HelveticaNeueDeskInterface-Light"), local(".LucidaGrandeUI"), local("Segoe UI Light"), local("Ubuntu Light"), local("Roboto-Light"), local("DroidSans"), local("Tahoma");
}

@font-face {
  font-family: system-ui;
  font-style: italic;
  font-weight: 300;
  src: local(".SFNS-LightItalic"), local(".SFNSText-LightItalic"), local(".HelveticaNeueDeskInterface-Italic"), local(".LucidaGrandeUI"), local("Segoe UI Light Italic"), local("Ubuntu Light Italic"), local("Roboto-LightItalic"), local("DroidSans"), local("Tahoma");
}

@font-face {
  font-family: system-ui;
  font-style: normal;
  font-weight: 400;
  src: local(".SFNS-Regular"), local(".SFNSText-Regular"), local(".HelveticaNeueDeskInterface-Regular"), local(".LucidaGrandeUI"), local("Segoe UI"), local("Ubuntu"), local("Roboto-Regular"), local("DroidSans"), local("Tahoma");
}

@font-face {
  font-family: system-ui;
  font-style: italic;
  font-weight: 400;
  src: local(".SFNS-Italic"), local(".SFNSText-Italic"), local(".HelveticaNeueDeskInterface-Italic"), local(".LucidaGrandeUI"), local("Segoe UI Italic"), local("Ubuntu Italic"), local("Roboto-Italic"), local("DroidSans"), local("Tahoma");
}

@font-face {
  font-family: system-ui;
  font-style: normal;
  font-weight: 500;
  src: local(".SFNS-Medium"), local(".SFNSText-Medium"), local(".HelveticaNeueDeskInterface-MediumP4"), local(".LucidaGrandeUI"), local("Segoe UI Semibold"), local("Ubuntu Medium"), local("Roboto-Medium"), local("DroidSans-Bold"), local("Tahoma Bold");
}

@font-face {
  font-family: system-ui;
  font-style: italic;
  font-weight: 500;
  src: local(".SFNS-MediumItalic"), local(".SFNSText-MediumItalic"), local(".HelveticaNeueDeskInterface-MediumItalicP4"), local(".LucidaGrandeUI"), local("Segoe UI Semibold Italic"), local("Ubuntu Medium Italic"), local("Roboto-MediumItalic"), local("DroidSans-Bold"), local("Tahoma Bold");
}

@font-face {
  font-family: system-ui;
  font-style: normal;
  font-weight: 700;
  src: local(".SFNS-Bold"), local(".SFNSText-Bold"), local(".HelveticaNeueDeskInterface-Bold"), local(".LucidaGrandeUI"), local("Segoe UI Bold"), local("Ubuntu Bold"), local("Roboto-Bold"), local("DroidSans-Bold"), local("Tahoma Bold");
}

@font-face {
  font-family: system-ui;
  font-style: italic;
  font-weight: 700;
  src: local(".SFNS-BoldItalic"), local(".SFNSText-BoldItalic"), local(".HelveticaNeueDeskInterface-BoldItalic"), local(".LucidaGrandeUI"), local("Segoe UI Bold Italic"), local("Ubuntu Bold Italic"), local("Roboto-BoldItalic"), local("DroidSans-Bold"), local("Tahoma Bold");
}

html {
  padding: 0;
  margin: 0;
}

body {
  font-family: system-ui;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  margin: 0;
  overflow: hidden;
  color: white;
  transition: opacity 300ms;
  opacity: 1;
  background-image: url('https://rawcdn.githack.com/chupato/chupato.github.io/2b0d64f85aa8ac45922c676d15d3aac4a398b84d/launcher/background.avif');
  background-size: cover;
  background-position: center;
}

header {
  text-align: center;
  padding: 16px;
  user-select: none;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

header h2 {
  font-weight: 300;
}

header h2 b {
  font-weight: 900;
  color: #F8B700;
}

main {
  flex-grow: 1;
  padding: 16px;
  user-select: none;
}

footer {
  padding: 16px;
  display: flex;
  gap: 16px;
  justify-content: right;
  align-items: center;
  background: #0008;
  border-top: 1px solid black;
  outline: 1px solid #f8b7005c;
  box-shadow: #000a 0px 0px 40px 3px;
}

#logo {
  display: block;
  position: absolute;
  background-image: url(https://rawcdn.githack.com/chupato/chupato.github.io/2b0d64f85aa8ac45922c676d15d3aac4a398b84d/launcher/logo.avif);
  height: 150px;
  width: 200px;
  z-index: 10;
  left: 0px;
  bottom: 0px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  transform: rotate(0deg);
  transition: transform ease-out 200ms;
}

#logo:hover {
  filter: brightness(1.1) contrast(110%);
  transform: rotate(2.5deg);
}

a {
  color: hotpink;
  text-decoration: none;
}

body[data-status="loading"] {
  opacity: 0;
}

button:hover {
  color: #FFEC71;
  background-color: #FFEC7111;
}

button:active {
  transform: translateY(1px);
}

button:disabled {
  opacity: 0.8;
  cursor: wait;
  filter: grayscale(0.3);
  background: linear-gradient(45deg, black, red);
  background-size: 200% 200%;
  animation: disabledAnimation 1s infinite alternate;
}

@keyframes disabledAnimation {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 100% 50%;
  }
}

button.primary:hover {
  border: 1px solid #FF522C;
  background-color: #AA2409;
}

button.primary {
  color: rgb(248, 183, 0);
  background-color: rgba(170, 36, 9, 0.8);
  border-color: rgb(255, 43, 0);
}

button {
  align-items: center;
  background-color: #0008;
  box-sizing: border-box;
  border: solid 1px;
  color: #F8B700;
  column-gap: 8px;
  cursor: default;
  display: flex;
  font-family: system-ui;
  font-size: 24px;
  font-weight: 600;
  grid-auto-flow: column;
  justify-content: center;
  height: 72px;
  padding: 0 30px;
  position: relative;
  text-align: center;
  text-decoration-color: rgb(248, 183, 0);
  text-decoration-line: none;
  text-decoration-style: solid;
  text-decoration-thickness: auto;
  text-transform: uppercase;
  text-wrap-mode; nowrap;
  transition-behavior: normal, normal;
  transition-delay: 0s, 0s;
  transition-duration: 0.2s, 0.2s;
  transition-property: background-color, color;
  transition-timing-function: ease, ease;
  user-select: none;
  white-space-collapse: collapse;
  flex-grow: 0;
}

#scan-output {
  display: inline-block;
  padding: 2px 4px;
  margin: 2px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid transparent;
}

#scan-output:hover {
  border: 1px solid #FFF8;
}

#scan-output[data-status="pending"] {
  background-color: darkblue;
}

#scan-output[data-status="success"] {
  background-color: darkgreen;
}

#scan-output[data-status="fail"] {
  background-color: darkmagenta;
}

#debug {
  white-space: pre-wrap;
  height: 15ch;
  overflow-y: scroll;
  word-break: break-word;
  background-color: #0008;
  padding: 1ch;
  border-radius: 1ch;
  border: 2px solid #587165;
  scroll-behavior: smooth; /* Smooth scrolling */
}

.key { color: #60ffaf; font-weight: 750 }
.action { color: #61b7ff; font-style: italic }
.value-type-boolean { color: #c8a2fe }
.value-type-number { color: #ff9161 }
.value-type-string { color: #fad59d }
.value-type-object { color: #ACC }

</style>
  </head>
  <body style="background-color: black" data-status="loading">
    <div id="logo"></div>
    <header>
      <h2>
        <b>C</b>hallenge
        <b>H</b>eroes
        <b>U</b>ltimate
        <b>P</b>rivate
        <b>A</b>dventure
        <b>T</b>wink
        <b>O</b>nline
      </h2>
    </header>
    <main>
      <div>
        <label>
          <span id='scan-message'>Looking for your World of Warcraft install...</span>
          <input id='wow-dir' style="display: none" type='file' accept='.exe' />
          <pre id='scan-output' />
        </label>
      </div>
      <details>
        <summary>debug (<span id="debug-log-count">0</span>)</summary>
        <pre id='debug'></pre>
      </details>
    </main>
    <footer>
      <button id="start-wow-dir-scan">Re-Scan</button>
      <button id="patch">Patch</button>
      <button id="play">Play</button>
    </footer>
    <script type="module">
const url = new URL(location.href)
const version = url.pathname.split('/')[2] || 'master'
const port = url.searchParams.get('port')
if (!port) throw Error('Must be run with a port')
const GET = async (path, init) => {
  const res = await fetch(`http://localhost:${port}/${path}`, init)
  if (res.headers.get('content-type') === 'application/json') {
    return res.json()
  }
  return res
}
const POST = (path, data) => GET(path, { method: 'POST', body: JSON.stringify(data) })
const code = "" // ⚡
const routeInitRes = await GET('routes', { method: 'POST', body: `async () => {${code}}` })

const $ = q => document.querySelector(q.join(''))
const $$ = (query) => [...document.querySelectorAll(query.join(''))]

const debug = $`#debug`
const debugCount = $`#debug-log-count`

for (const btn of $$`button`) {
  btn.onclick = async () => {
    btn.disabled = true
    await GET(btn.id)
    btn.disabled = false
  }
}

const ev = new EventSource(`http://localhost:${port}/events`)
ev.addEventListener('error', console.log)

const scanOutput = $`#scan-output`
const scanMessage = $`#scan-message`
const logs = []
ev.addEventListener('message', ({ data }) => {
  try {
    const { type, payload } = JSON.parse(data)
    console.log({ [type]: payload })
    if (type === 'log') {
      debug.get
      const scroll = Math.abs((debug.scrollHeight - debug.scrollTop) - debug.clientHeight) < 20
      // check if we are scrolling up
      debugCount.textContent = Number(debugCount.textContent) + 1
      const playloadEntries = Object.entries(payload)
      for (const [k, v] of playloadEntries) {
        const code = document.createElement('code')
        if (k === 'action') {
          code.className = k
          code.append(v)
          debug.append(' ', code)
          continue
        }
        const span = document.createElement('span')
        const vType = typeof v
        if (v && (vType === 'object')) {
          code.append(JSON.stringify(v))
        } else {
          code.append(v)
        }
        code.className = `value-type-${vType}`
        span.className = 'key'
        span.append(k)
        debug.append(' ', span, ' ', code)
      }
      debug.append('\n')
      scroll && (debug.scrollTop = debug.scrollHeight)
    }

    if (type === 'scan-start') {
      scanOutput.dataset.status = 'pending'
    }

    if (type === 'scan-progress') {
      if (!config.wowDir) {
        const validDir = payload.wowExeDirectories.find(dir => dir.isValid)
        if (validDir) {
          config.wowDir = validDir.path
          POST('config', config)
        }
      }
      scanOutput.replaceChildren(`Scanning: ${payload.path}\nFound:\n${payload.wowExeDirectories.map(d => `  - ${d.isValid ? '✅' : '❔'} ${d.path}`).join('\n')}`)
    }

    if (type === 'scan-complete') {
      scanOutput.dataset.status = payload.wowDir ? 'success' : 'fail'
      scanOutput.replaceChildren(payload.wowDir?.replace(/\\+/g, '/') || 'please click here to select one')
      scanMessage.replaceChildren(
        payload.wowDir
          ? 'Using WoW Client installed here:'
          : 'WoW Client not found:',
      )
    }
  } catch (err) {
    console.log(err)
  }
})
const config = await GET('config')
document.body.dataset.status = 'scanning'
await GET('start-wow-dir-scan')
if (config.wowDir) {
  document.body.dataset.status = 'patching'
}

const audioContext = new AudioContext()
const audioBuffer = fetch('https://rawcdn.githack.com/chupato/chupato.github.io/d4b928bd955c26ca2ec10c7c6c90d188ca474563/launcher/chupato-cute.ogg')
  .then(response => response.arrayBuffer())
  .then(arrayBuffer => audioContext.decodeAudioData(arrayBuffer))

const timings = [
  0, // Challenge
  0.92, // Heroes
  1.62, // Ultimate
  2.432, // Private
  2.95, // Adventure
  3.65, // Twink
  4.15, // Online
  4.7, // Chupato
]

const play = async (...args) => {
  const source = audioContext.createBufferSource()
  source.buffer = await audioBuffer
  source.connect(audioContext.destination)
  source.start(0, ...args)
}

$`#logo`.onclick = () => play()
// TODO
// - toggle debug mode on / off
// - Allow to manually select path
// - Allow install (?)
// - Karaoke Jingle (URGENT)
// - Discord OAuth (with auto-login (?))
// - Change PWD

    </script>
  </body>
</html>
