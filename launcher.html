html {
  padding: 0;
  margin: 0;
}

body {
  font-family: system-ui;
  height: 100vh;
  display: flex;
  flex-direction: column;
  padding: 0;
  margin: 0;
  overflow: hidden;
  color: white;
  transition: opacity 300ms;
  opacity: 1;
  background-image: url('https://rawcdn.githack.com/chupato/chupato.github.io/2b0d64f85aa8ac45922c676d15d3aac4a398b84d/launcher/background.avif');
  background-size: cover;
  background-position: center;
}

header {
  text-align: center;
  padding: 16px;
  user-select: none;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

header h2 {
  font-weight: 300;
}

header h2 b {
  font-weight: 900;
  color: #F8B700;
}

main {
  flex-grow: 1;
  padding: 16px;
  user-select: none;
}

footer {
  padding: 16px;
  display: flex;
  gap: 16px;
  justify-content: right;
  align-items: center;
  background: #0008;
  border-top: 1px solid black;
  outline: 1px solid #f8b7005c;
  box-shadow: #000a 0px 0px 40px 3px;
}

#logo {
  display: block;
  position: absolute;
  background-image: url(https://rawcdn.githack.com/chupato/chupato.github.io/2b0d64f85aa8ac45922c676d15d3aac4a398b84d/launcher/logo.avif);
  height: 150px;
  width: 200px;
  z-index: 10;
  left: 0px;
  bottom: 0px;
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  transform: rotate(0deg);
  transition: transform ease-out 200ms;
}

#logo:hover {
  filter: brightness(1.1) contrast(110%);
  transform: rotate(2.5deg);
}

a {
  color: hotpink;
  text-decoration: none;
}

body[data-status="loading"] {
  opacity: 0;
}

button:hover {
  color: #FFEC71;
  background-color: #FFEC7111;
}

button:active {
  transform: translateY(1px);
}

button:disabled {
  opacity: 0.8;
  cursor: wait;
  filter: grayscale(0.3);
  background: linear-gradient(45deg, black, red);
  background-size: 200% 200%;
  animation: disabledAnimation 1s infinite alternate;
}

@keyframes disabledAnimation {
  0% {
    background-position: 0% 50%;
  }
  100% {
    background-position: 100% 50%;
  }
}

button.primary:hover {
  border: 1px solid #FF522C;
  background-color: #AA2409;
}

button.primary {
  color: rgb(248, 183, 0);
  background-color: rgba(170, 36, 9, 0.8);
  border-color: rgb(255, 43, 0);
}

button {
  align-items: center;
  background-color: #0008;
  box-sizing: border-box;
  border: solid 1px;
  color: #F8B700;
  column-gap: 8px;
  cursor: default;
  display: flex;
  font-family: system-ui;
  font-size: 24px;
  font-weight: 600;
  grid-auto-flow: column;
  justify-content: center;
  height: 72px;
  padding: 0 30px;
  position: relative;
  text-align: center;
  text-decoration-color: rgb(248, 183, 0);
  text-decoration-line: none;
  text-decoration-style: solid;
  text-decoration-thickness: auto;
  text-transform: uppercase;
  text-wrap-mode; nowrap;
  transition-behavior: normal, normal;
  transition-delay: 0s, 0s;
  transition-duration: 0.2s, 0.2s;
  transition-property: background-color, color;
  transition-timing-function: ease, ease;
  user-select: none;
  white-space-collapse: collapse;
  flex-grow: 0;
}

#scan-output {
  display: inline-block;
  padding: 2px 4px;
  margin: 2px;
  border-radius: 4px;
  cursor: pointer;
  border: 1px solid transparent;
}

#scan-output:hover {
  border: 1px solid #FFF8;
}

#scan-output[data-status="pending"] {
  background-color: darkblue;
}

#scan-output[data-status="success"] {
  background-color: darkgreen;
}

#scan-output[data-status="fail"] {
  background-color: darkmagenta;
}

#debug {
  white-space: pre-wrap;
  height: 15ch;
  overflow-y: scroll;
  word-break: break-word;
  background-color: #0008;
  padding: 1ch;
  border-radius: 1ch;
  border: 2px solid #587165;
  scroll-behavior: smooth; /* Smooth scrolling */
}

.key { color: #60ffaf; font-weight: 750 }
.action { color: #61b7ff; font-style: italic }
.value-type-boolean { color: #c8a2fe }
.value-type-number { color: #ff9161 }
.value-type-string { color: #fad59d }
.value-type-object { color: #ACC }

const ev = new EventSource(`http://localhost:${port}/events`)
ev.addEventListener('error', console.log)

const scanOutput = $`#scan-output`
const scanMessage = $`#scan-message`
const logs = []
ev.addEventListener('message', ({ data }) => {
  try {
    const { type, payload } = JSON.parse(data)
    console.log({ [type]: payload })
    if (type === 'log') {
      debug.get
      const scroll = Math.abs((debug.scrollHeight - debug.scrollTop) - debug.clientHeight) < 20
      // check if we are scrolling up
      debugCount.textContent = Number(debugCount.textContent) + 1
      const playloadEntries = Object.entries(payload)
      for (const [k, v] of playloadEntries) {
        const code = document.createElement('code')
        if (k === 'action') {
          code.className = k
          code.append(v)
          debug.append(' ', code)
          continue
        }
        const span = document.createElement('span')
        const vType = typeof v
        if (v && (vType === 'object')) {
          code.append(JSON.stringify(v))
        } else {
          code.append(v)
        }
        code.className = `value-type-${vType}`
        span.className = 'key'
        span.append(k)
        debug.append(' ', span, ' ', code)
      }
      debug.append('\n')
      scroll && (debug.scrollTop = debug.scrollHeight)
    }

    if (type === 'scan-start') {
      scanOutput.dataset.status = 'pending'
    }

    if (type === 'scan-progress') {
      if (!config.wowDir) {
        const validDir = payload.wowExeDirectories.find(dir => dir.isValid)
        if (validDir) {
          config.wowDir = validDir.path
          POST('config', config)
        }
      }
      scanOutput.replaceChildren(`Scanning: ${payload.path}\nFound:\n${payload.wowExeDirectories.map(d => `  - ${d.isValid ? '✅' : '❔'} ${d.path}`).join('\n')}`)
    }

    if (type === 'scan-complete') {
      scanOutput.dataset.status = payload.wowDir ? 'success' : 'fail'
      scanOutput.replaceChildren(payload.wowDir?.replace(/\\+/g, '/') || 'please click here to select one')
      scanMessage.replaceChildren(
        payload.wowDir
          ? 'Using WoW Client installed here:'
          : 'WoW Client not found:',
      )
    }
  } catch (err) {
    console.log(err)
  }
})
